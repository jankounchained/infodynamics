site_name: infodynamics
repo_url: https://github.com/centre-for-humanities-computing/infodynamics
site_url: https://centre-for-humanities-computing.github.io/infodynamics
site_description: Windowed average relative entropies conviniently wrapped in a sklearn-like API
site_author: Jan Kostkan

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
            setup_commands:
                - import sys
                - sys.path.append('../')
copyright: Maintained by Jan Kostkan.
theme:
  name: material
  feature:
    tabs: true
  palette:
    primary: white
    accent: blue
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true