[pytest]
testpaths = tests
markers =
    slow: long-running property-based (hypothesis) tests
    network: downloads a sentence-embedding model from the Hugging Face Hub on first run; deselect with -m "not network" to run offline
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
    # tslearn warns at import when the optional h5py package is missing;
    # infodynamics does not use tslearn's HDF5 features.
    ignore:h5py not installed:UserWarning:tslearn.bases.bases
